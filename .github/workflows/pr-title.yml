name: PR title

# The PR title becomes the commit subject on main (squash merges take the PR
# title), and commits here are Conventional Commits (AGENTS.md). This checks
# the title before the merge, while it can still be fixed. Its own workflow,
# not a ci.yml job, because it must re-run when the title is edited, and
# ci.yml must not.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # one regex
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|chore|revert|security|ci|test|style|build)(\([A-Za-z0-9_./-]+\))?!?: [^ ]'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a Conventional Commit: <type>(<scope>)!: <subject>, type one of feat fix perf refactor docs chore revert security ci test style build"
            exit 1
          fi
