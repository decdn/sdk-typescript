name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# git-cliff, for scripts/release.sh's fixture-repo tests in `test` and
# `coverage`, which fail under CI without it: the release tarball, pinned by
# sha256. RELEASING.md names this version as the one CI tests with, so bump
# the two together.
env:
  GIT_CLIFF_VERSION: 2.14.1
  GIT_CLIFF_SHA256: dfe9bef0c7a00d05fafe78e6e591a1a280d39dd495b8066764db0a559acde67f

# A re-pushed PR supersedes its own run; a push to main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, unit, script and contract tests (against the fake gateway), the
  # build, and both entry points loaded by package name. 20.19 is the floor
  # `engines` names. The real-gateway contract runs are decdn's `SDK contract`
  # workflow and `release-gateways` below.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The pin is the workflow's `env`.
      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"
      - run: pnpm test
      - run: pnpm build
      # From the repo root, `@decdn/client` resolves to this package through
      # its own `exports`, as it does for a consumer.
      - name: Load the built entry points
        run: |
          node -e 'require("@decdn/client"); require("@decdn/client/node")'
          node --input-type=module -e 'await import("@decdn/client"); await import("@decdn/client/node")'

  # The unit, script and contract tests with coverage of src/. The run fails
  # below the thresholds in vitest.config.ts; the upload after it is
  # best-effort, so a GitHub API failure never blocks a PR. A PR's run checks
  # out its head commit, not the merge commit: the action files the report
  # under the head SHA, so the lines must be the head's.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # `Upload code coverage` posts the Cobertura report to GitHub Code Quality.
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # The pin is the workflow's `env`.
      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"
      - run: pnpm test:coverage
      # GitHub Code Quality shows the PR's coverage against `main`'s. A run
      # below the thresholds still writes the report, and uploads it. The
      # action skips fork PRs by itself (their token is read-only).
      - name: Upload code coverage
        if: ${{ !cancelled() && hashFiles('coverage/cobertura-coverage.xml') != '' }}
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: false

  # The Chromium smoke. Only the headless shell is installed, without
  # `--with-deps`: the runner image ships Google Chrome and the libraries it
  # needs, and apt-installing Playwright's fonts and xvfb can take minutes.
  browser:
    name: browser (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install chromium-headless-shell
      - run: pnpm test:browser

  # The package as npm would ship it: publint and arethetypeswrong.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/check-package.sh

  # The workflows and the shell scripts.
  lint-ci:
    name: lint (workflows, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: zizmor,shellcheck
      # install-action has no actionlint; its image also shellchecks `run:`.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # The token turns on zizmor's online audits (known-vulnerable actions).
      # Its policy for action refs is in .github/zizmor.yml.
      - run: zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - run: shellcheck scripts/*.sh

  # Whether a PR changes what the release-gateway run tests: the SDK, the
  # contract suite, its vitest project and the fake, the dependencies, or how
  # the run is made. A rename counts by both its paths.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gateway: ${{ steps.files.outputs.gateway }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          pattern='^(src/|test/contract/|test/support/|test/fake-gateway\.ts$|vitest\.config\.ts$|package\.json$|pnpm-lock\.yaml$|KEYS$|scripts/decdn-contract\.sh$|\.github/workflows/(ci|gateway-releases)\.yml$)'
          if grep -qE "$pattern" <<<"$files"; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi

  # The contract suite against the floor and the latest decdn release, with
  # their signed binaries (.github/workflows/gateway-releases.yml).
  release-gateways:
    name: release gateways
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    permissions:
      contents: read
    # `./`, not zizmor's `$/`: actionlint does not parse `$/` yet.
    uses: ./.github/workflows/gateway-releases.yml # zizmor: ignore[self-repository]

  # The single required check. A PR that leaves the release-gateway run's
  # inputs alone, and a push to main, skip it.
  ci-success:
    name: CI success
    if: always()
    needs:
      [test, coverage, browser, package, lint-ci, changes, release-gateways]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: changes, release-gateways
          jobs: ${{ toJSON(needs) }}
